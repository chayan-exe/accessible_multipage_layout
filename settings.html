<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessible settings form">
  <title>Accessible Dashboard - Settings</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="brand"><a href="index.html" aria-label="AccessBoard home">AccessBoard</a></div>
    <nav aria-label="Primary navigation">
      <ul class="nav-list">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="users.html">Users</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="settings.html" aria-current="page">Settings</a></li>
      </ul>
    </nav>
    <button id="theme-toggle" class="button secondary" type="button" aria-label="Toggle color theme">Theme</button>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar navigation">
      <h2>Settings</h2>
      <nav aria-label="Settings navigation">
        <ul>
          <li><a href="#profile">Profile</a></li>
          <li><a href="#preferences">Preferences</a></li>
        </ul>
      </nav>
    </aside>

    <main id="main-content" class="main-content">
      <section id="profile" aria-labelledby="settings-title">
        <p class="eyebrow">Configuration</p>
        <h1 id="settings-title">Settings</h1>

        <form id="settings-form">
          <fieldset>
            <legend>Profile information</legend>

            <div class="form-group">
              <label for="full-name">Full name</label>
              <input id="full-name" name="fullName" type="text" autocomplete="name" required minlength="2" aria-describedby="name-help">
              <small id="name-help">Enter at least 2 characters.</small>
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" required aria-label="Account email address">
            </div>

            <div class="form-group">
              <label for="website">Website</label>
              <input id="website" name="website" type="url" placeholder="https://example.com" aria-label="Personal website URL">
            </div>
          </fieldset>

          <fieldset id="preferences">
            <legend>Preferences</legend>

            <div class="form-group">
              <label for="language">Language</label>
              <select id="language" name="language" required>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
              </select>
            </div>

            <div class="form-group">
              <span class="label-text">Notifications</span>
              <label class="checkbox-label" for="notifications">
                <input id="notifications" name="notifications" type="checkbox" checked>
                Receive email notifications
              </label>
            </div>
          </fieldset>

          <button class="button" type="submit">Save settings</button>
          <p id="settings-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>

  <footer class="site-footer"><p>&copy; 2026 AccessBoard.</p></footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="AccessBoard demo authentication"><title>AccessBoard - Login</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head>
<body class="auth-page">
<main class="auth-shell" id="main-content"><section class="auth-card" aria-labelledby="login-title"><p class="eyebrow">Secure demo</p><h1 id="login-title">AccessBoard Login</h1><p>Authentication is simulated locally for this capstone demo.</p><form id="login-form" novalidate><fieldset><legend>Sign in</legend><div class="form-group"><label for="login-username">Username</label><input id="login-username" name="username" type="text" autocomplete="username" required minlength="3"></div><div class="form-group"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="6"></div></fieldset><button class="button" type="submit">Sign in</button><p id="login-message" class="form-message" role="alert" aria-live="assertive"></p></form><p class="demo-hint"><strong>Demo:</strong> admin / admin123</p></section></main>
</body></html>
